<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#0055d4"/>
    </linearGradient>

    <!-- Helmet Yellow Gradient -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="35%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Turquoise Trim Gradient -->
    <linearGradient id="trimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4DD0E1"/>
      <stop offset="50%" stop-color="#00ACC1"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>

    <!-- Visor Glass Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="40%" stop-color="#B2EBF2"/>
      <stop offset="100%" stop-color="#4DD0E1"/>
    </linearGradient>

    <!-- Shading Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#001833" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle App/Favicon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Background Cute Bubbles -->
  <circle cx="85" cy="110" r="24" fill="#ffffff" opacity="0.35"/>
  <circle cx="76" cy="100" r="8" fill="#ffffff" opacity="0.85"/>

  <circle cx="430" cy="145" r="18" fill="#ffffff" opacity="0.3"/>
  <circle cx="424" cy="139" r="6" fill="#ffffff" opacity="0.75"/>

  <circle cx="435" cy="385" r="28" fill="#ffffff" opacity="0.25"/>
  <circle cx="426" cy="376" r="9" fill="#ffffff" opacity="0.7"/>

  <circle cx="75" cy="395" r="18" fill="#ffffff" opacity="0.3"/>
  <circle cx="70" cy="389" r="5" fill="#ffffff" opacity="0.75"/>

  <!-- Sparkle Stars -->
  <polygon points="120,60 123,70 133,73 123,76 120,86 117,76 107,73 117,70" fill="#FFF59D" opacity="0.85"/>
  <polygon points="390,85 392,93 400,95 392,97 390,105 388,97 380,95 388,93" fill="#FFF59D" opacity="0.75"/>

  <!-- Main Diver Character Group with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Helmet Top Loop / Handle -->
    <circle cx="256" cy="72" r="32" fill="none" stroke="#E65100" stroke-width="18"/>
    <circle cx="256" cy="72" r="32" fill="none" stroke="url(#helmetGrad)" stroke-width="12"/>

    <!-- Helmet Side Ear Valves -->
    <!-- Left Ear Valve -->
    <rect x="70" y="218" width="38" height="76" rx="16" fill="#006064" stroke="#00363a" stroke-width="6"/>
    <rect x="74" y="224" width="30" height="64" rx="12" fill="url(#trimGrad)"/>
    <line x1="80" y1="244" x2="98" y2="244" stroke="#004D40" stroke-width="5" stroke-linecap="round"/>
    <line x1="80" y1="264" x2="98" y2="264" stroke="#004D40" stroke-width="5" stroke-linecap="round"/>

    <!-- Right Ear Valve -->
    <rect x="404" y="218" width="38" height="76" rx="16" fill="#006064" stroke="#00363a" stroke-width="6"/>
    <rect x="408" y="224" width="30" height="64" rx="12" fill="url(#trimGrad)"/>
    <line x1="414" y1="244" x2="432" y2="244" stroke="#004D40" stroke-width="5" stroke-linecap="round"/>
    <line x1="414" y1="264" x2="432" y2="264" stroke="#004D40" stroke-width="5" stroke-linecap="round"/>

    <!-- Little Cute Diver Hands Waving -->
    <!-- Left Hand -->
    <g transform="translate(108, 375) rotate(-25)">
      <ellipse cx="0" cy="0" rx="30" ry="22" fill="#00ACC1" stroke="#004D40" stroke-width="6"/>
      <circle cx="-14" cy="-14" r="11" fill="#4DD0E1" stroke="#004D40" stroke-width="4"/>
      <circle cx="1" cy="-19" r="11" fill="#4DD0E1" stroke="#004D40" stroke-width="4"/>
      <circle cx="16" cy="-13" r="11" fill="#4DD0E1" stroke="#004D40" stroke-width="4"/>
    </g>
    <!-- Right Hand -->
    <g transform="translate(404, 375) rotate(25)">
      <ellipse cx="0" cy="0" rx="30" ry="22" fill="#00ACC1" stroke="#004D40" stroke-width="6"/>
      <circle cx="-16" cy="-13" r="11" fill="#4DD0E1" stroke="#004D40" stroke-width="4"/>
      <circle cx="-1" cy="-19" r="11" fill="#4DD0E1" stroke="#004D40" stroke-width="4"/>
      <circle cx="14" cy="-14" r="11" fill="#4DD0E1" stroke="#004D40" stroke-width="4"/>
    </g>

    <!-- Collar / Body Base -->
    <path d="M 152 410 Q 256 465 360 410 C 385 455 370 480 348 480 L 164 480 C 142 480 127 455 152 410 Z" 
          fill="url(#trimGrad)" stroke="#00363a" stroke-width="7"/>
    <!-- Collar Plate Yellow -->
    <path d="M 176 416 Q 256 454 336 416 C 322 450 292 460 256 460 C 220 460 190 450 176 416 Z" 
          fill="url(#helmetGrad)" stroke="#E65100" stroke-width="5"/>
    <circle cx="256" cy="442" r="12" fill="#26C6DA" stroke="#004D40" stroke-width="4"/>

    <!-- Helmet Outer Dome -->
    <circle cx="256" cy="256" r="165" fill="url(#helmetGrad)" stroke="#E65100" stroke-width="9"/>
    
    <!-- Helmet Top Gloss / Highlight -->
    <path d="M 155 150 A 135 135 0 0 1 357 150" fill="none" stroke="#FFFDE7" stroke-width="14" stroke-linecap="round" opacity="0.85"/>

    <!-- Inner Turquoise Rim -->
    <circle cx="256" cy="260" r="128" fill="url(#trimGrad)" stroke="#004D40" stroke-width="7"/>

    <!-- Golden Visor Ring -->
    <circle cx="256" cy="260" r="112" fill="#FFB300" stroke="#FF6F00" stroke-width="7"/>

    <!-- Rivets/Bolts on Visor Ring -->
    <circle cx="256" cy="155" r="7" fill="#FFF9C4" stroke="#E65100" stroke-width="2.5"/>
    <circle cx="330" cy="186" r="7" fill="#FFF9C4" stroke="#E65100" stroke-width="2.5"/>
    <circle cx="361" cy="260" r="7" fill="#FFF9C4" stroke="#E65100" stroke-width="2.5"/>
    <circle cx="330" cy="334" r="7" fill="#FFF9C4" stroke="#E65100" stroke-width="2.5"/>
    <circle cx="256" cy="365" r="7" fill="#FFF9C4" stroke="#E65100" stroke-width="2.5"/>
    <circle cx="182" cy="334" r="7" fill="#FFF9C4" stroke="#E65100" stroke-width="2.5"/>
    <circle cx="151" cy="260" r="7" fill="#FFF9C4" stroke="#E65100" stroke-width="2.5"/>
    <circle cx="182" cy="186" r="7" fill="#FFF9C4" stroke="#E65100" stroke-width="2.5"/>

    <!-- Visor Glass -->
    <circle cx="256" cy="260" r="96" fill="url(#visorGrad)"/>

    <!-- Kawaii Face inside Visor -->
    <!-- Blushing Cheeks -->
    <ellipse cx="202" cy="286" rx="16" ry="9" fill="#FF5252" opacity="0.5"/>
    <ellipse cx="310" cy="286" rx="16" ry="9" fill="#FF5252" opacity="0.5"/>

    <!-- Big Cute Anime Left Eye -->
    <ellipse cx="216" cy="256" rx="19" ry="25" fill="#0D47A1"/>
    <circle cx="210" cy="245" r="9" fill="#FFFFFF"/>
    <circle cx="224" cy="267" r="4.5" fill="#FFFFFF"/>
    <!-- Eye Sparkle Diamond -->
    <polygon points="220,250 223,254 220,258 217,254" fill="#4DD0E1"/>

    <!-- Big Cute Anime Right Eye -->
    <ellipse cx="296" cy="256" rx="19" ry="25" fill="#0D47A1"/>
    <circle cx="290" cy="245" r="9" fill="#FFFFFF"/>
    <circle cx="304" cy="267" r="4.5" fill="#FFFFFF"/>
    <!-- Eye Sparkle Diamond -->
    <polygon points="300,250 303,254 300,258 297,254" fill="#4DD0E1"/>

    <!-- Cute Smiling Mouth -->
    <path d="M 242 280 Q 256 295 270 280" fill="none" stroke="#C2185B" stroke-width="5" stroke-linecap="round"/>

    <!-- Visor Glass Reflection / Glare -->
    <path d="M 182 216 A 78 78 0 0 1 312 195 A 90 90 0 0 0 196 244 Z" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="320" cy="225" r="6" fill="#FFFFFF" opacity="0.8"/>
    <!-- Big Sparkle Star on Glass -->
    <polygon points="326,204 330,212 338,215 330,218 326,226 322,218 314,215 322,212" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
